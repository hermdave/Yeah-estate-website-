name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/luxembourg-realestate-map-utphne
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already running so a
# deploy always finishes rather than being interrupted by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Served from https://<user>.github.io/<repo>/, not the domain root.
          NEXT_PUBLIC_BASE_PATH: /Yeah-estate-website-

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages (source: GitHub Actions) automatically if it
          # isn't already, instead of requiring a manual Settings -> Pages
          # step. Falls back to that manual step if the token lacks
          # permission to do this.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

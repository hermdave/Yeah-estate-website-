name: Deploy to GitHub Pages

# One Pages site serves both projects in this repo:
#   https://<user>.github.io/<repo>/       Luxembourg real-estate map (built from its own branch)
#   https://<user>.github.io/<repo>/tmua/  TMUA Study Desk (static build of tmua/)
# A deploy replaces the whole site, so every deploy builds both.
on:
  push:
    branches:
      - claude/tmua-study-dashboard-0t2frj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already running so a
# deploy always finishes rather than being interrupted by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MAP_BRANCH: claude/luxembourg-realestate-map-utphne

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout real-estate map
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAP_BRANCH }}
          path: map

      - name: Checkout TMUA Study Desk
        uses: actions/checkout@v4
        with:
          path: tmua-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: map/package-lock.json

      - name: Build real-estate map
        working-directory: map
        run: |
          npm ci
          npm run build
        env:
          # Served from https://<user>.github.io/<repo>/, not the domain root.
          NEXT_PUBLIC_BASE_PATH: /Yeah-estate-website-

      - name: Build TMUA Study Desk into /tmua/
        run: python3 tmua-src/tmua/tools/build_static.py map/out/tmua

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./map/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

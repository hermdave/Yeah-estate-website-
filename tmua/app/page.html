<title>TMUA Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.css">
<style>
/* Layout: one narrow working column (answer-sheet width), sticky header, tab bar at the bottom on phones and under the header on wide screens. */
:root {
  --bg: #f4f6f8;          /* page */
  --surface: #ffffff;     /* cards, the answer sheet */
  --ink: #14181f;         /* primary text */
  --ink-2: #4c5563;       /* secondary text */
  --ink-3: #7b8494;       /* muted labels */
  --line: #dde2e8;        /* hairlines */
  --sheet: #d9475f;       /* answer-sheet drop-out ink: lozenge outlines */
  --sheet-soft: #fbe9ec;
  --accent: #2a78d6;      /* actions, timed series */
  --accent-ink: #ffffff;
  --accent-soft: #e6f0fb;
  --series-2: #eb6834;    /* untimed series */
  --good: #12804a; --good-soft: #e3f4ea;
  --warn: #a86400; --warn-soft: #fbf0dc;
  --bad: #c62f3a; --bad-soft: #fbe6e7;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #181c22; --ink: #eef1f5; --ink-2: #b4bcc8; --ink-3: #8a93a1;
    --line: #2a3039; --sheet: #ec6b81; --sheet-soft: #3a1f26; --accent: #3987e5; --accent-ink: #ffffff;
    --accent-soft: #1b2b40; --series-2: #d95926; --good: #43c07f; --good-soft: #143222;
    --warn: #e0a43a; --warn-soft: #36290f; --bad: #f0727b; --bad-soft: #3b1a1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #181c22; --ink: #eef1f5; --ink-2: #b4bcc8; --ink-3: #8a93a1;
  --line: #2a3039; --sheet: #ec6b81; --sheet-soft: #3a1f26; --accent: #3987e5; --accent-ink: #ffffff;
  --accent-soft: #1b2b40; --series-2: #d95926; --good: #43c07f; --good-soft: #143222;
  --warn: #e0a43a; --warn-soft: #36290f; --bad: #f0727b; --bad-soft: #3b1a1d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .82rem; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
.brand span { color: var(--sheet); }
.days { margin-left: auto; font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
.days b { font-family: var(--font-mono); color: var(--ink); }
.tabs { display: flex; gap: 2px; max-width: 760px; margin: 0 auto; }
.tabs a { flex: 1; text-align: center; text-decoration: none; color: var(--ink-2); padding: 8px 4px 10px; font-size: .85rem; font-weight: 500; border-bottom: 2px solid transparent; position: relative; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .68rem; line-height: 18px; margin-left: 4px; font-family: var(--font-mono); }
@media (max-width: 640px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)); max-width: none; }
  .tabs a { border-bottom: 0; border-top: 2px solid transparent; padding: 9px 2px 11px; font-size: .78rem; }
  .tabs a[aria-current="page"] { border-top-color: var(--accent); }
  main { padding-bottom: 84px !important; }
}

main { max-width: 760px; margin: 0 auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; padding-inline: 6px; color: var(--ink-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
.pill.none { background: var(--bg); color: var(--ink-3); border: 1px solid var(--line); }
.pill.untimed { background: var(--sheet-soft); color: var(--series-2); }
.pill.timed { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.reserve { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-2); }

.hero { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.hero .big { font-family: var(--font-display); font-weight: 700; font-size: 3.4rem; line-height: 1; letter-spacing: -.03em; }
.notice { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 6px; font-size: .88rem; }

/* Paper cards */
.papers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.paper { display: flex; flex-direction: column; gap: 10px; }
.paper .t { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.paper .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.paper .hist { font-size: .8rem; color: var(--ink-2); }

/* Answer sheet */
.sheet { background: var(--surface); border: 1.5px solid var(--sheet); border-radius: 6px; overflow: hidden; }
.sheet-head { display: flex; justify-content: space-between; padding: 8px 12px; color: var(--sheet); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; border-bottom: 1px solid var(--sheet); }
.qrow { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 4px; padding: 5px 8px; border-bottom: 1px solid var(--sheet-soft); }
.qrow:last-child { border-bottom: 0; }
.qrow.cur { background: var(--accent-soft); }
.qn { font-family: var(--font-mono); font-weight: 600; color: var(--sheet); text-align: center; background: none; border: 0; padding: 6px 0; font-size: .95rem; }
.qrow.cur .qn { color: var(--accent); }
.lozenges { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.loz { height: 32px; border: 1.5px solid var(--sheet); border-radius: 999px; background: transparent; color: var(--sheet); font-family: var(--font-mono); font-size: .8rem; font-weight: 600; padding: 0; min-width: 0; }
.loz.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.loz.key { box-shadow: 0 0 0 2px var(--good); }
.flag { height: 32px; border: 1.5px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink-3); font-size: .95rem; padding: 0; }
.flag.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.qt { grid-column: 2 / 4; font-size: .72rem; color: var(--ink-3); font-family: var(--font-mono); margin-top: -2px; }

.sessbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 4; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--bg); padding-block: 8px; }
.clock { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 600; letter-spacing: -.02em; }
.clock.low { color: var(--bad); }
.pace { font-size: .8rem; color: var(--ink-2); }

/* Results and errors */
.item { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: .8rem; color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: .84rem; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--surface); }
.redo { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); }
.redo span.due { color: var(--bad); font-weight: 600; }
.redo span.ok { color: var(--good); }

/* Practice question */
.qcard .stem { font-size: 1.02rem; line-height: 1.6; overflow-x: auto; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.opt .l { width: 30px; height: 30px; border: 1.5px solid var(--sheet); border-radius: 999px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; color: var(--sheet); font-size: .82rem; }
.opt.on { border-color: var(--ink); }
.opt.on .l { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.opt .x { overflow-x: auto; min-width: 0; }
.qnav { display: flex; flex-wrap: wrap; gap: 5px; }
.qnav button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: .8rem; }
.qnav button.ans { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.qnav button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.qnav button.fl { box-shadow: inset 0 -3px 0 var(--warn); }
.solution { border-left: 3px solid var(--line); padding-left: 12px; font-size: .92rem; overflow-x: auto; }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-3); font: 11px var(--font-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--ink-3); stroke-width: 1; }
.chart .ref { stroke: var(--bad); stroke-width: 1; stroke-dasharray: 4 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) 70px; column-gap: 10px; row-gap: 2px; align-items: center; font-size: .84rem; padding-block: 4px; }
.hbar .name { grid-column: 1 / -1; min-width: 0; overflow-wrap: break-word; }
@media (min-width: 641px) { .hbar { grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 70px; } .hbar .name { grid-column: auto; } }
.hbar .track { height: 10px; background: var(--bg); border-radius: 0 4px 4px 0; position: relative; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--accent); }
.hbar .v { text-align: right; font-family: var(--font-mono); font-size: .8rem; color: var(--ink-2); }
details.tbl summary { cursor: pointer; font-size: .8rem; color: var(--ink-2); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--surface); font-size: .78rem; padding: 6px 9px; border-radius: 6px; max-width: 240px; }
textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); font-family: var(--font-mono); font-size: .78rem; }
.empty { text-align: center; padding: 26px 10px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: .86rem; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .btn, .loz, .chip, .opt { transition: background-color .12s, border-color .12s, color .12s; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">TMUA <span>Study Desk</span></div>
    <div class="days" id="days"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#today">Today</a>
    <a href="#papers">Papers</a>
    <a href="#practice">Practice</a>
    <a href="#errors">Errors</a>
    <a href="#progress">Progress</a>
  </nav>
</header>
<main id="main">
  <div class="card empty">Loading your study data…</div>
</main>
<div id="tip" hidden></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="app.js"></script>
